name: Image

# Builds the SD card image. Manually (Actions → Image → Run workflow) for a
# test image, attached to the run; and from release.yml for every release.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    name: pi-gen (Raspberry Pi OS Lite, Bookworm, arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Room to build (pi-gen needs ~20 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: arm64 emulation
        # pi-gen's build-docker.sh needs qemu-aarch64-static on the host and
        # registers it with binfmt_misc itself.
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static binfmt-support
      - name: Build
        env:
          RELEASE_REPO: ${{ github.repository }}
        run: bash image/build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: image
          path: |
            image/deploy/*.img.xz
            image/deploy/*.sha256
            image/deploy/solpersona-gallery-app-*.tar.gz
          retention-days: 14
          compression-level: 0
