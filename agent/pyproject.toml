[project]
name = "solpersona-gallery-agent"
dynamic = ["version"]
description = "The local agent of the SolPersona Gallery for Raspberry Pi."
requires-python = ">=3.11"
# On the Pi these come from Debian Bookworm (python3-aiohttp 3.8, python3-pil 9.4),
# never from pip; tests run against exactly those (Dockerfile.test, CI).
dependencies = ["aiohttp>=3.8,<4", "Pillow>=9.4"]

[tool.setuptools.dynamic]
version = { attr = "solpersona_gallery.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
